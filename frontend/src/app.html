<!doctype html>
<html lang="%lang%" dir="%dir%" class="%theme%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- PWA -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffc700" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1917" />
		<meta name="application-name" content="Keenti" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Keenti" />
		<!--
			Pre-hydration scheme resolution. The server already stamps `dark` onto the
			root element's class from the KEENTI_THEME cookie, so this only has to
			cover the 'system' case (the OS query is not knowable server-side) and
			responses served from cache with a stale class. Crucially it consults the
			cookie first: a user who forced light on a dark-OS machine must not get a
			dark flash before hydration.
		-->
		<script>
			(function () {
				var match = document.cookie.match(/(?:^|;\s*)KEENTI_THEME=([^;]*)/);
				var mode = match ? decodeURIComponent(match[1]) : 'system';
				var dark =
					mode === 'dark' ||
					(mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
