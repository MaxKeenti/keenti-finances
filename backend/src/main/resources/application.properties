quarkus.datasource.db-kind=postgresql

# Local development uses the developer-managed database. The test profile
# intentionally has no URL so Quarkus Dev Services can provision PostgreSQL.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/keenti_finances
%dev.quarkus.datasource.username=keenti
%dev.quarkus.datasource.password=keenti

quarkus.hibernate-orm.schema-management.strategy=none

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Production profile — all DB config from Railway env vars
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}
# Validate connections that sat idle before handing them to a request. This
# lets Agroal discard connections closed by a database restart or network event.
%prod.quarkus.datasource.jdbc.foreground-validation-interval=30S
