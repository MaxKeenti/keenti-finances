quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/keenti_finances
quarkus.datasource.username=keenti
quarkus.datasource.password=keenti

quarkus.hibernate-orm.database.generation=none

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.scheduler.enabled=true

# Production profile — all DB config from Railway env vars
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}
# SvelteKit proxy handles CORS; Quarkus is internal-only on Railway private network
%prod.quarkus.http.cors=false
