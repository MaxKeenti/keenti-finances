quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18-alpine
quarkus.datasource.devservices.reuse=false

quarkus.hibernate-orm.schema-management.strategy=none

# A clean Dev Services database must be migrated before it can be validated.
# PostgresSchemaTest performs explicit validation after startup migration.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-migration-naming=true
